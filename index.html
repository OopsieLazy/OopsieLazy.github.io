<!DOCTYPE html>

<html lang="en">
    <head>
        <meta charset="UTF-8">
        <!-- Security (L2): a Content Security Policy. GitHub Pages can't send headers, so it rides in a
             meta tag, first in <head> because it only covers what comes after it. Every script, style,
             font, picture and fetch must come from this site: an injected <script> or a tag pointing at
             another server simply won't load. No page uses inline code, so nothing needs 'unsafe-inline' -->
        <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <!-- CONTENT: the tab title and the text search engines and link previews show -->
        <title>Zach Nott Mechanical Design &amp; CAD</title>
        <meta name="description" content="Zach Nott designs mechanical parts in Fusion 360 and prints them to test: a guitar bridge, printer fixes and print-in-place hinges, plus photography and code.">
        <!-- Staging (L1, D47): search engines skip the site until launch. Removing this line IS the launch (L3) -->
        <meta name="robots" content="noindex">
        <!-- Link previews (L1b): what a shared link shows in a chat or a post. Every address here is FULL
             (https://...): those sites fetch it from their own servers, so a relative path means nothing to them.
             canonical names the one true address of this page. share-card.png is 1200 x 630, the size link
             previews use (README, "Share picture"). CONTENT: og:title and og:description follow the tab title
             and description above; change them together -->
        <link rel="canonical" href="https://nottco.ca/">
        <meta property="og:type" content="website">
        <meta property="og:site_name" content="Zach Nott">
        <meta property="og:title" content="Zach Nott Mechanical Design &amp; CAD">
        <meta property="og:description" content="Zach Nott designs mechanical parts in Fusion 360 and prints them to test: a guitar bridge, printer fixes and print-in-place hinges, plus photography and code.">
        <meta property="og:url" content="https://nottco.ca/">
        <meta property="og:image" content="https://nottco.ca/assets/images/share-card.png">
        <meta property="og:image:width" content="1200">
        <meta property="og:image:height" content="630">
        <meta property="og:image:alt" content="Zach Nott: mechanical design, CAD and the things I print, beside two CAD renders and a photo">
        <meta name="twitter:card" content="summary_large_image">
        <!-- Who this site is about, in the shared vocabulary search engines read (schema.org "Person"). It's data,
             not code: browsers never run a script of this type, so the Content Security Policy doesn't apply.
             sameAs lists the profiles that are the same person. No email or street address: those stay private -->
        <script type="application/ld+json">
        {
            "@context": "https://schema.org",
            "@type": "Person",
            "name": "Zach Nott",
            "url": "https://nottco.ca/",
            "image": "https://nottco.ca/assets/images/share-card.png",
            "jobTitle": "Mechanical designer",
            "address": { "@type": "PostalAddress", "addressLocality": "Courtice", "addressRegion": "ON", "addressCountry": "CA" },
            "knowsAbout": ["Mechanical design", "CAD", "Fusion 360", "SolidWorks", "3D printing", "Python"],
            "sameAs": ["https://github.com/OopsieLazy", "https://makerworld.com/en/@Azuya_1500"]
        }
        </script>
        <!-- The five stripes; an SVG icon stays sharp at any size and switches to greys in dark mode -->
        <link rel="icon" href="favicon.svg" type="image/svg+xml">
        <!-- Each CSS and JS link carries ?v=<date it last changed>. A browser keeps files it has
             downloaded; a new ?v makes the address new, so it fetches the new file instead of
             mixing a new page with old styles or scripts. Change a file: bump its ?v on every page -->
        <link rel="stylesheet" href="css/styles.css?v=20261128">
        <!-- cardyles.css: the Blueprint cards in the "Featured cards" drawer -->
        <link rel="stylesheet" href="css/cardyles.css?v=20261126">
        <link rel="stylesheet" href="css/homyles.css?v=20261128">
        <script src="js/script.js?v=20261128" defer></script>
        <!-- datacript.js before homcript.js: deferred scripts run in this order -->
        <script src="js/datacript.js?v=20261126-2" defer></script>
        <script src="js/homcript.js?v=20261127" defer></script>
        <!-- No defer on purpose: it sets the saved theme before the page is drawn (no white flash) -->
        <script src="js/themcript.js?v=20261127-2"></script>
    </head>

    <body class="thehomepage">

        <div id="page" class="site">
            <a class="skip-link screen-reader-text" href="#content">Skip to content</a>
            <!-- Same header in index.html, projects.html, aboutme.html, contact.html, code.html and art.html: change all six together -->
            <header id="topbranch" class="site-header">
                <div class="site-branding">
                </div>

                <nav id="site-nav" class="main-nav wrapper" aria-label="Main">
                    <!-- Mobile menu button: hidden until js/script.js runs, so without JS the links just stay visible -->
                    <button id="menu-toggle" class="button menu-toggle" type="button" aria-expanded="true" hidden>
                        <span aria-hidden="true">&#9776;</span> <span class="menu-word">Menu</span>
                    </button>

                    <!-- Left Side Of Header -->
                    <div class="header-column-left">
                        <ul class="header-left-list">
                            <li class="header-left-item" id="item-cad">
                                <a class="menu-link" href="projects.html">CAD</a></li>
                            <li class="header-left-item" id="item-code">
                                <a class="menu-link" href="code.html">Code</a></li>
                            <li class="header-left-item" id="item-art">
                                <a class="menu-link" href="art.html">Art</a></li>
                        </ul>
                    </div>

                    <!-- Center Of Header -->
                    <!-- Your name is the Home link (O1, D51). Typed normally here; the CSS sets it in capitals,
                         so screen readers say "Zach Nott" instead of spelling Z-A-C-H -->
                    <div class="header-column-center">
                        <a href="index.html" class="size-spacing-style-logo" aria-current="page">
                            <span class="header-name">Zach Nott</span>
                        </a>
                    </div>

                    <!-- Right Side Of Header -->
                    <div class="header-column-right">
                        <div class="inner-menu">
                            <div id="primary-nav" class="menu-wrap">
                                <ul class="menu-horizontal">
                                    <li class="header-right-item" id="item-about">
                                        <a class="menu-link" href="aboutme.html">About</a></li>
                                    <li class="header-right-item" id="item-contact">
                                        <a class="menu-link" href="contact.html">Contact</a></li>
                                </ul>
                            </div>
                        </div>
                    </div>
                </nav>
                <!-- Theme switch (O1, D51; three words since the owner's pick T1, 2026-11-27): Day, Night and
                     Auto, the one in use underlined like the current page in the nav. Each word is a button
                     with aria-pressed, so a screen reader hears "Night, toggle button, pressed". Phones show
                     only the word in use, and pressing it moves on to the next (styles.css, THE THEME SWITCH).
                     Hidden until js/themcript.js runs: without JS the site simply follows the OS -->
                <div class="theme-switch" role="group" aria-label="Theme" hidden>
                    <button class="theme-choice" type="button" data-choice="day">Day</button>
                    <button class="theme-choice" type="button" data-choice="lantern">Night</button>
                    <button class="theme-choice" type="button" data-choice="auto">Auto</button>
                </div>
            </header>

            <!-- Landmarks: screen readers can jump straight to main or footer. The skip link targets #content -->
            <main id="content" class="site-main wrapper">

                <!-- HOME (O4, D51): the work and nothing else, like the reference. js/homcript.js fills the list
                     with CAD projects (data/projects.json) and photos (data/art.json), mixed, packed as a masonry mosaic.
                     No words show until a tile is hovered or focused (css/homyles.css); they're inside each link,
                     so screen readers and search engines still read them. The page's name stays a real <h1>,
                     hidden from sight only. (The hero and the card stack were here until O4: git log -S "home-hero") -->
                <h1 class="screen-reader-text">Zach Nott: mechanical design, CAD and photography</h1>
                <!-- One quiet row above the mosaic (owner, 2026-11-24: minimal, no section label, no arrow):
                     the two ways into CAD, the main work. "Featured cards" slides the flip cards open right here,
                     pushing the mosaic down; it stays hidden until js/homcript.js has built the cards.
                     The section's name is still a real <h2> for screen readers, hidden from sight -->
                <h2 id="mosaic-title" class="screen-reader-text">Selected work</h2>
                <p class="mosaic-links">
                    <!-- A disclosure button: aria-expanded says open or shut, aria-controls points at the drawer -->
                    <button class="cards-open" type="button" aria-expanded="false" aria-controls="featured-cards" hidden>Featured cards</button>
                    <a class="mosaic-link" href="projects.html">CAD portfolio</a>
                </p>

                <!-- FEATURED CARDS (owner, 2026-11-24: "slide open or push down" instead of a pop-up): the Blueprint
                     card stack, Home's hero until O4. The drawer animates its height open (homyles.css, THE CARDS DRAWER).
                     "inert" while shut: the closed cards can't be reached by Tab or a screen reader. js/homcript.js builds
                     one card per project with "featured": true (up to 3); Previous / Next and ← → turn the stack like a wheel -->
                <div id="featured-cards" class="cards-drawer" role="region" aria-label="Featured CAD cards" inert>
                    <div class="cards-drawer-inner">
                        <div class="featured-slot">
                            <div class="card-stack"></div>
                            <div class="stack-controls">
                                <!-- aria-atomic: when the name changes, screen readers read the whole line.
                                     aria-live is added by the script AFTER the first fill, so building it stays quiet -->
                                <p class="featured-caption" aria-atomic="true">Featured: <b class="featured-name"></b></p>
                                <div class="stack-buttons">
                                    <button class="button stack-prev" type="button" hidden>Previous</button>
                                    <button class="button stack-next" type="button" hidden>Next</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <ul id="mosaic" class="mosaic" role="list" aria-labelledby="mosaic-title"></ul>
                <noscript>
                    <p class="mosaic-note">The work needs JavaScript. <a href="projects.html">Open the CAD portfolio</a>.</p>
                </noscript>

            </main>

            <!-- The footer: a slim pine band, centred (E1, D53); .footer-inner keeps it lined up with the page -->
            <footer class="site-footer">
                <div class="footer-inner wrapper">
                    <!-- Same footer in all six pages: change them together.
                         Declutter (D-a, 2026-11-23): only what the header doesn't already give you,
                         the outside links and the © line. The name and the page list were the header twice.
                         One centred row of links, then the © line with the stripe mark under the name (css/styles.css, FOOTER).
                         Every link uses the same pattern: to fill one in, change only its href (and text) -->
                    <!-- Two groups in one wrapper: side by side on phones, one dotted row on wider screens -->
                    <div class="footer-extras">
                        <!-- The owner's profiles on other sites -->
                        <div class="footer-group">
                            <p class="footer-label">Elsewhere</p>
                            <ul class="footer-list">
                                <li class="footer-item"><a class="footer-link" href="https://github.com/OopsieLazy">GitHub</a></li>
                                <li class="footer-item"><a class="footer-link" href="https://makerworld.com/en/@Azuya_1500">MakerWorld</a></li>
                            </ul>
                        </div>
                        <!-- Email and Resume go to the contact page (2.2), which keeps the address out of
                             the HTML: a plain mailto: here would be scraped by spam bots -->
                        <div class="footer-group">
                            <p class="footer-label">Get in touch</p>
                            <ul class="footer-list">
                                <li class="footer-item"><a class="footer-link" href="contact.html#email">Email</a></li>
                                <li class="footer-item"><a class="footer-link" href="contact.html#resume">Resume</a></li>
                            </ul>
                        </div>
                    </div>
                    <p class="footer-copy">&copy; <span data-year>2026</span> <span class="footer-name">Zach Nott</span></p>
                </div>
            </footer>
        </div>
    </body>

</html>
